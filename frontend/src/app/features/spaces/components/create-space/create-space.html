@if ( showCreateSpaceModal() ) {
<div role="dialog" aria-modal="true" class="fixed inset-0 flex items-center justify-center bg-foreground/50">
  <div class="bg-background rounded-default shadow-lg max-w-lg w-full p-6 relative">
    <button type="button" class="absolute top-4 right-4 focus:outline-none" aria-label="Close modal"
      (click)="closeCreateSpaceModal()">
      <ng-icon name="lucideX" size="24" />
    </button>
    <div>
      <p class="title-2 leading-none mb-4">Create a new space</p>
      <form [formRoot]="createSpaceForm" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label for="name" class="flex flex-col gap-2">
            <span class="sr-only">Space name</span>
            <input type="name" id="name" [formField]="createSpaceForm.name" class="input" placeholder="Dev Team">
          </label>

          @if (createSpaceForm.name().invalid() && createSpaceForm.name().touched()) {
          <ul class="flex flex-col gap-1 text-danger">
            @for (error of createSpaceForm.name().errors(); track error) {
            <li class="text-sm">{{ error.message }}</li>
            }
          </ul>
          }
        </div>

        @if (createSpaceError()) {
        <div class="text-danger" role="alert">
          {{ createSpaceError() }}
        </div>
        }

        <button type="submit" [disabled]="createSpaceForm().submitting()" class="button-primary w-fit dark:text-foreground">
          @if (createSpaceForm().submitting()) {
          Sending...
          } @else {
          Create space
          }
        </button>
      </form>
    </div>
  </div>
</div>
}
