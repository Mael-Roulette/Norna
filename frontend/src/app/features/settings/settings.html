<div ngTabs>
  <nav ngTabList selectionMode="follow" selectedTab="profile" class="flex gap-2 pb-2 border-b border-b-accent">
    <div ngTab value="profile" class="relative py-2 px-3 rounded-default flex items-center gap-3
         cursor-pointer transition-all
         bg-background/40 text-foreground
         hover:bg-background/60 hover:text-foreground
         data-[active=true]:bg-background
         data-[active=true]:text-foreground">
      Profile
    </div>

    <div ngTab value="appearance" class="relative py-2 px-3 rounded-default flex items-center gap-3
         cursor-pointer transition-all
         bg-background/40 text-foreground
         hover:bg-background/60 hover:text-foreground
         data-[active=true]:bg-background
         data-[active=true]:text-foreground">
      Appearance
    </div>
  </nav>

  <section class="block h-full pt-5">
    <div ngTabPanel value="profile">
      <ng-template ngTabContent>
        <app-profile-settings />
      </ng-template>
    </div>

    <div ngTabPanel value="appearance">
      <ng-template ngTabContent>
        <app-appearance-settings />
      </ng-template>
    </div>
  </section>
</div>
