<div class="rounded-default bg-background p-2 w-full">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button type="button" cdkDragHandle class="drag-handle" aria-label="Drag column">
        <ng-icon name="tablerGripVertical" size="20" />
      </button>
      @if (updateNameInputVisible()) {
      <input type="text"
        class="title-3 w-full focus:outline-none focus:border-b-3 focus:border-b-accent focus:text-foreground-50 selection:bg-blue/50"
        #nameInput [value]="column()?.name" (keydown.enter)="saveName(nameInput.value)"
        (keydown.escape)="cancelUpdateName()" (blur)="saveName(nameInput.value)" />
      } @else {
      <p class="title-3">{{ column()?.name }}</p>
      }
    </div>

    <div class="relative" #menuWrapper>
      <button type="button"
        class="rounded-default aspect-square flex items-center justify-center p-2 hover:bg-foreground/15"
        aria-haspopup="menu" [attr.aria-expanded]="isMenuOpen" aria-label="Column options" (click)="toggleMenu()">
        <ng-icon name="tablerDots" size="24" />
      </button>

      @if (isMenuOpen) {
      <app-column-menu class="absolute mt-2 right-0 z-10" (delete)="openDeleteModal()"
        (editName)="showUpdateNameInput()" />
      }
    </div>
  </div>
</div>

<app-confirm-modal [show]="showConfirmModal()" [title]="'Delete column?'"
  [description]="'Are you sure you want to delete this column?'" [confirmText]="'Delete'" [cancelText]="'Cancel'"
  variant="danger" (confirmed)="deleteColumn(column()?.id)" (cancelled)="closeDeleteModal()" />
