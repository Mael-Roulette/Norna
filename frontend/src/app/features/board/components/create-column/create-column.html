@if ( showColumnModal() ) {
<div role="dialog" aria-modal="true" class="fixed inset-0 flex items-center justify-center bg-foreground/50">
  <div class="bg-background rounded-default shadow-lg max-w-lg w-full p-6 relative">
    <button type="button" class="absolute top-4 right-4 focus:outline-none" aria-label="Close modal" (click)="closeCreateColumnModal()">
      <ng-icon name="lucideX" size="24" />
    </button>

    <div>
      <p class="title-2 leading-none mb-4">Add a new board</p>
      <form [formRoot]="addColumnForm" class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <label for="name" class="flex flex-col gap-2">
            <span class="sr-only">Board name</span>
            <input type="name" id="name" [formField]="addColumnForm.name" class="input" placeholder="To do">
          </label>

          @if (addColumnForm.name().invalid() && addColumnForm.name().touched()) {
          <ul class="flex flex-col gap-1 text-danger">
            @for (error of addColumnForm.name().errors(); track error) {
            <li class="text-sm">{{ error.message }}</li>
            }
          </ul>
          }
        </div>

        @if (addColumnFormError()) {
        <div class="text-danger" role="alert">
          {{ addColumnFormError() }}
        </div>
        }

        <button type="submit" [disabled]="addColumnForm().submitting()"
          class="button-primary w-fit dark:text-foreground">
          @if (addColumnForm().submitting()) {
          Sending...
          } @else {
          Create column
          }
        </button>
      </form>
    </div>
  </div>
</div>
}
