<div class="rounded-default bg-background-50 w-56 p-1 flex flex-col">
  <button type="button"
    class="py-2 px-3 rounded-default flex items-center gap-3 text-foreground hover:bg-foreground/15 transition-all cursor-pointer w-auto"
    (click)="onEditName()">
    <ng-icon name="monoEditAlt" size="20" />
    Edit title
  </button>

  <button type="button"
    class="py-2 px-3 rounded-default flex items-center gap-3 text-foreground hover:bg-foreground/15 transition-all cursor-pointer w-auto"
    (click)="onDelete()">
    <ng-icon name="fluentDelete" size="20" />
    Delete column
  </button>
</div>
