<section class="flex h-full flex-col">
  <div class="mb-3 flex items-center justify-between">
    <h1 class="text-background">{{ board.value()?.name }}</h1>

    <div class="flex items-center justify-end gap-5">
      <button type="button" class="button-secondary" (click)="openCreateColumnModal()">
        <ng-icon name="lucidePlus" size="24" />
        <span>Add Column</span>
      </button>
      <button type="button" class="button-secondary text-foreground">
        <span class="sr-only">Board settings</span>
        <ng-icon name="tablerDotsVertical" size="24" />
      </button>
    </div>
  </div>

  @if (board.isLoading()) {
  <p>Loading...</p>
  } @else {
  <div cdkDropList cdkDropListOrientation="horizontal"
    class="board-list flex flex-1 items-start gap-5 overflow-x-auto pb-4" (cdkDropListDropped)="drop($event)">
    @for (column of orderedColumns(); track column.id) {
    <app-column-item class="w-xs block shrink-0 h-full" [column]="column" [boardId]="boardId()"
      (renamed)="onColumnRenamed($event)" (deleted)="board.reload()" cdkDrag cdkDragLockAxis="x"
      [cdkDragStartDelay]="{ touch: 200, mouse: 0 }" (taskOpened)="openTaskModal($event)"
      (taskCreated)="onTaskCreated()" [spaceMembers]="spaceMembers()" />
    }
  </div>
  }
</section>

<app-create-column [boardId]="boardId()" [columns]="orderedColumns()" (created)="board.reload()" />

@if (selectedTask(); as task) {
<app-task-modal [task]="task" (closed)="selectedTaskId.set(null)" (deleted)="onTaskDeleted()"
  [spaceMembers]="spaceMembers()" />
}
