<main>
  <section class="w-fit">
    <h1>Signin</h1>
    <p>Oh you there, let's go back to work !</p>
    <form>
      <label for="email">
        <span>Email</span>
        <input type="email" id="email" [formField]="signinForm.email">
      </label>

      <label for="password">
        <span>Password</span>
        <input type="password" id="password" [formField]="signinForm.password">
      </label>
    </form>
  </section>
</main>
